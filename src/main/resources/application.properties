server.port=${PORT}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
#server.servlet.context-path=/api
#spring.data.rest.base-path=/api
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.datasource.url=jdbc:${DB_URL_CONNECTION}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.show-sql=false
#:para habilitar la creación automática de las tablas
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=${DB_SQL_SHOW}
spring.jpa.properties.hibernate.format_sql=${DB_SQL_SHOW}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#spring.jackson.time-zone=America/Lima
spring.jackson.time-zone=GMT-05

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:mysql://127.0.0.1:3306/buscacode_admin
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.locations=classpath:db/migration
spring.profiles.active=dev
